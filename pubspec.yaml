name: core_kit
description: >
  Shared, theme-driven core services and widgets for reuse across Flutter
  projects. Provides a brandable theme system, common UI widgets, networking,
  error handling, and architectural patterns.
version: 1.0.58
publish_to: none
repository: https://github.com/abdialidrus/flutter_core_kit

environment:
  sdk: ^3.12.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  dio: ^5.11.0
  the_logger: ^0.0.23
  logging: ^1.3.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  shared_preferences: ^2.5.5
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: ^3.2.5
  build_runner: ^2.15.1
  json_serializable: ^6.14.1
